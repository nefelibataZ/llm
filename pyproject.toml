[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eduagent-learning"
version = "0.1.0"
description = "A minimal, offline-first EduAgent learning project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eduagent = "eduagent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eduagent = ["data/*.json"]
